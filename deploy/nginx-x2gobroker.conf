# /etc/nginx/sites-available/x2gobroker  →  ln -s в sites-enabled
server {
    listen 80;
    server_name x2go.rrcki.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name x2go.rrcki.ru;

    ssl_certificate     /etc/ssl/x2go/x2go.rrcki.ru.crt;   # цепочка: сертификат + промежуточные
    ssl_certificate_key /etc/ssl/x2go/x2go.rrcki.ru.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    # Панель — только из сети администраторов.
    location /admin {
        allow 10.0.10.0/24;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
